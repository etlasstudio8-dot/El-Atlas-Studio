        function restoreBtn(btn) { if (btn) { btn.disabled = false; if (btn.__orig) btn.innerHTML = btn.__orig; } }
        function deriveUsername(email, existingUsername) {
            if (existingUsername && existingUsername.length >= 3) return existingUsername;
            const base = (email || '').split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g, '') || 'user';
            return base.length >= 3 ? base : base + '123';
        }

        let _dragSrcEl = null;
        function showSavingOrder(show) {
            let el = document.getElementById('saving-order-indicator');
            if (show) {
                if (!el) { el = document.createElement('div'); el.id = 'saving-order-indicator'; el.className = 'saving-order'; el.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;color:var(--accent)"></i> Saving order…'; document.body.appendChild(el); }
            } else { if (el) el.remove(); }
        }
        function makeDraggable(container, itemSelector, onDrop) {
            if (!isAdmin()) return;
            const items = container.querySelectorAll(itemSelector);
            items.forEach(item => {
                item.draggable = true;
                item.addEventListener('dragstart', e => { _dragSrcEl = item; item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
                item.addEventListener('dragend', () => { item.classList.remove('dragging'); container.querySelectorAll(itemSelector).forEach(i => i.classList.remove('drag-over')); });
                item.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; container.querySelectorAll(itemSelector).forEach(i => i.classList.remove('drag-over')); if (item !== _dragSrcEl) item.classList.add('drag-over'); });
                item.addEventListener('drop', e => {
                    e.preventDefault();
                    if (_dragSrcEl && _dragSrcEl !== item) {
                        const allItems = [...container.querySelectorAll(itemSelector)];
                        const srcIdx = allItems.indexOf(_dragSrcEl); const tgtIdx = allItems.indexOf(item);
                        if (srcIdx < tgtIdx) container.insertBefore(_dragSrcEl, item.nextSibling);
                        else container.insertBefore(_dragSrcEl, item);
                        item.classList.remove('drag-over');
                        onDrop([...container.querySelectorAll(itemSelector)]);
                    }
                });
            });
        }

            showSavingOrder(true);

            try {
                const teamArr = await apiGet('/team/admin/all'); const arr = Array.isArray(teamArr) ? teamArr : [];
                const match = arr.find(m => {
                    const mName = (m.name || '').toLowerCase().trim(); const eName = (employeeData.name || '').toLowerCase().trim();
                    const mEmail = (m.email || '').toLowerCase().trim(); const eEmail = (employeeData.email || '').toLowerCase().trim();
                    return mName === eName || (eEmail && mEmail === eEmail);

                if (match) {
                    const updateBody = { name: employeeData.name, position: employeeData.position || match.position || ROLE_LABELS[employeeData.role] || employeeData.role || match.position, email: employeeData.email || match.email };
                    if (employeeData.avatar || employeeData.avatarImg) { const av = employeeData.avatarImg || employeeData.avatar; updateBody.image = { url: av }; updateBody.avatar = av; }
                    await api('PUT', '/team/' + match._id, updateBody); return true;
                }
            } catch (e) { console.warn('Team sync failed:', e.message); }
            return false;
        }

        const PAGES = {};
    </script>

        window.openPortModal = function (k) {

        window.updateProjectFields = function (category) {
            const cat = String(category || '').toLowerCase();
            const isVideo = cat === 'video' || cat.includes('video');
            const isWeb = ['web', 'software'].includes(cat) || cat.includes('web') || cat.includes('software') || cat.includes('mobile');

            const webFields = document.getElementById('pf-web-fields');
            const visualFields = document.getElementById('pf-visual-fields');

            if (webFields) webFields.style.display = isWeb || cat === 'other' ? '' : 'none';

        window.savePort = async function (id) {
            const category = document.getElementById('pf-cat').value;
            const isVideo = category === 'video';
            const isWeb = ['web', 'software'].includes(category);
            const isVisual = ['web', 'software', 'brand', 'design', 'marketing', 'other'].includes(category);
            const body = {
                title: document.getElementById('pf-title').value.trim(),
                description: document.getElementById('pf-desc').value.trim(),
                category,
                client: document.getElementById('pf-client').value.trim(),
                completionDate: document.getElementById('pf-date').value || null
            };
            if (isWeb || category === 'other') {
                body.projectUrl = document.getElementById('pf-url').value.trim();
                body.technologies = document.getElementById('pf-tech').value.split(',').map(v => v.trim()).filter(Boolean);
                body.features = document.getElementById('pf-features').value.split('\n').map(v => v.trim()).filter(Boolean);

            if (isVisual) {
                body.mainImage = { url: document.getElementById('pf-img').value.trim() };
                body.images = document.getElementById('pf-gallery').value.split('\n').map(url => url.trim()).filter(Boolean).map(url => ({ url }));
                body.image = document.getElementById('pf-img').value.trim();
            }
            if (isVideo) body.videoUrl = document.getElementById('pf-video-url').value.trim();
            if (!body.title || !body.description) return toast('Title and description required', 'err');
            const selectedVideoFile = isVideo ? document.getElementById('pf-video-file')?.files?.[0] : null;
            const hasExistingVideo = document.getElementById('pf-existing-video')?.value === '1';
            if (isVideo && !body.videoUrl && !selectedVideoFile && !hasExistingVideo) return toast('Add a video link or upload a video file', 'err');
            const btn = document.getElementById('pf-btn'); spinBtn(btn, 'Saving…');
            try {
                const result = id ? await api('PUT', '/portfolio/' + id, body) : await api('POST', '/portfolio', body);
                const projectId = id || result?.data?._id;
                const videoFile = selectedVideoFile;
                if (videoFile) {
                    if (!projectId) throw new Error('Project saved, but video upload could not find the project ID');
                    if (videoFile.size > 100 * 1024 * 1024) throw new Error('Video must be smaller than 100 MB');
                    spinBtn(btn, 'Uploading video…');
                    const form = new FormData();
                    form.append('video', videoFile);
                    await apiForm('/portfolio/' + projectId + '/video', form);
                }
                toast(videoFile ? 'Project and video saved' : 'Project saved');
                closeModal();
                PAGES.portfolio();
            } catch (e) { toast(e.message, 'err'); }
            restoreBtn(btn);
        };
        window.delPort = async function (id) {
            if (!confirm('Delete?')) return;
            try { await api('DELETE', '/portfolio/' + id); toast('Deleted'); PAGES.portfolio(); } catch (e) { toast(e.message, 'err'); }
        };
    </script>

    <script>
        PAGES.team = async () => {
            const pc = document.getElementById('content');
            const admin = isAdmin();
            try {
                const [members, portfolioItems, usersRaw] = await Promise.all([
                    apiGet('/team/admin/all'), apiGet('/portfolio'),
                    admin ? apiGet('/users') : Promise.resolve([])
                ]);
                const arr = Array.isArray(members) ? members : [];
                const portArr = Array.isArray(portfolioItems) ? portfolioItems : [];
                const usersArr = Array.isArray(usersRaw) ? usersRaw : (usersRaw?.users || []);
                arr.sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
                window._teamArr = arr; window._portArr = portArr; window._empArr = usersArr; window._activeTeamTab = 'team';
                const visibleCount = arr.filter(m => m.showOnWebsite !== false).length;
                const hiddenCount = arr.length - visibleCount;
                const dragHintHtml = admin ? `<div class="drag-hint" id="drag-hint-row"><i class="ti ti-arrows-move" style="color:var(--accent)"></i> Drag to reorder · <span style="color:#4ade80"><i class="ti ti-eye"></i> ${visibleCount} visible</span> · <span style="color:var(--text3)"><i class="ti ti-eye-off"></i> ${hiddenCount} hidden</span></div>` : '';
                pc.innerHTML = `<div class="page">
                    <div class="ph"><div><h2>Team Members</h2></div>${admin ? `<button class="btn btn-primary" onclick="openTeamModal(null)"><i class="ti ti-plus"></i> Add</button>` : ''}</div>
                    <div class="team-tabs" id="team-tabs">
                        <button class="team-tab active" onclick="switchTeamTab('team',this)"><i class="ti ti-users"></i> Members (${arr.length})</button>
                        ${admin ? `<button class="team-tab" onclick="switchTeamTab('employees',this)"><i class="ti ti-user-search"></i> Employees (${usersArr.length})</button>` : ''}
                    </div>
                    <div class="search-bar">
                        <i class="ti ti-search"></i>
                        <input type="text" id="team-search" placeholder="Search…" oninput="filterTeamView(this.value)">
                        <button class="clear-search" onclick="document.getElementById('team-search').value='';filterTeamView('')"><i class="ti ti-x"></i></button>
                    </div>
                    ${dragHintHtml}
                    <div class="tgrid" id="team-grid">${renderTeamCards(arr, arr)}</div>
                </div>`;
                const grid = document.getElementById('team-grid');
                if (grid && admin) makeDraggable(grid, '.tc[data-id]', saveTeamOrder);
            } catch (e) { pc.innerHTML = `<div class="list-empty">Error: ${esc(e.message)}</div>`; }
        };

        function renderTeamCards(filtered, all) {
            const admin = isAdmin();
            if (!filtered.length) return '<div class="list-empty" style="grid-column:1/-1">No members found.</div>';
            return filtered.map((m) => {
                const realIdx = all.indexOf(m);
                const ini = initials(m.name);
                const photo = m.image?.url || m.avatar || m.avatarImg || '';
                const pos = m.position || ROLE_LABELS[m.role] || m.role || 'Member';
                const skills = (m.expertise || m.skills || []).slice(0, 4).map(s => `<span class="chip">${esc(s)}</span>`).join('');
                const k = storeObj(m);
                const isVisible = m.showOnWebsite !== false;
                const socHtml = [
                    m.social?.instagram || m.instagram ? `<a href="${esc(m.social?.instagram || m.instagram)}" target="_blank" class="btn btn-ghost btn-sm btn-icon"><i class="ti ti-brand-instagram"></i></a>` : '',
                    m.social?.linkedin || m.linkedin ? `<a href="${esc(m.social?.linkedin || m.linkedin)}" target="_blank" class="btn btn-ghost btn-sm btn-icon"><i class="ti ti-brand-linkedin"></i></a>` : '',
                    m.social?.github || m.github ? `<a href="${esc(m.social?.github || m.github)}" target="_blank" class="btn btn-ghost btn-sm btn-icon"><i class="ti ti-brand-github"></i></a>` : '',
                ].filter(Boolean).join('');
                const orderNum = admin ? `<span class="order-badge" style="margin-right:5px">${realIdx + 1}</span>` : '';
                const dragHandle = admin ? `<div class="drag-handle" title="Drag"><i class="ti ti-grip-vertical"></i></div>` : '';
                return `<div class="tc" data-id="${esc(m._id)}" data-k="${k}" style="${!isVisible ? 'opacity:0.55;' : ''}">
                    <div class="tc-top">
                        ${photo ? `<img src="${esc(photo)}" class="tc-photo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="tc-fb" style="display:none">${ini}</div>` : `<div class="tc-fb">${ini}</div>`}
                        <div style="flex:1;min-width:0">
                            <div class="tc-name" style="display:flex;align-items:center;gap:5px">${orderNum}${esc(m.name)}</div>
                            <div style="display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:wrap">
                                <span class="badge bg-purple">${esc(pos)}</span>
                                <span class="badge ${isVisible ? 'bg-green' : 'bg-gray'}" style="font-size:10px"><i class="ti ${isVisible ? 'ti-eye' : 'ti-eye-off'}" style="margin-right:3px;font-size:10px"></i>${isVisible ? 'Visible' : 'Hidden'}</span>
                            </div>
                        </div>
                    </div>
                    ${m.bio ? `<div class="tc-bio">${esc(m.bio)}</div>` : ''}
                    ${skills ? `<div class="chips">${skills}</div>` : ''}
                    ${socHtml ? `<div style="display:flex;gap:5px;margin-bottom:9px">${socHtml}</div>` : ''}
                    ${admin ? `<div class="tc-acts" style="margin-top:10px">
                        ${dragHandle}
                        <button class="btn btn-sm ${isVisible ? 'btn-ghost' : 'btn-secondary'}" style="flex:1;justify-content:center" onclick="toggleWebVisibility('${esc(m._id)}',${isVisible})">
                            <i class="ti ${isVisible ? 'ti-eye-off' : 'ti-eye'}"></i> ${isVisible ? 'Hide' : 'Show'}
                        </button>
                        <button class="btn btn-ghost btn-sm btn-icon" onclick="openTeamModal('${k}')"><i class="ti ti-edit"></i></button>
                        <button class="btn btn-ghost btn-sm btn-icon" onclick="delMember('${esc(m._id)}')"><i class="ti ti-trash"></i></button>
                    </div>` : ''}
                </div>`;
            }).join('');
        }

        function renderEmployeeCards(filtered, teamArr) {
            const admin = isAdmin();
            if (!filtered.length) return '<div class="list-empty" style="grid-column:1/-1">No employees found.</div>';
            const teamEmails = new Set(teamArr.map(t => (t.email || '').toLowerCase()));
            const teamNames = new Set(teamArr.map(t => (t.name || '').toLowerCase().trim()));
            return filtered.map((u) => {
                const ini = initials(u.name);
                const photo = u.avatarImg || u.avatar || '';
                const pos = u.position || ROLE_LABELS[u.role] || u.role || 'Employee';
                const k = storeObj(u);
                const inTeam = (u.email && teamEmails.has(u.email.toLowerCase())) || (u.name && teamNames.has(u.name.toLowerCase().trim()));
                return `<div class="tc" data-emp-id="${esc(u._id)}">
                    <div class="tc-top">
                        ${photo ? `<img src="${esc(photo)}" class="tc-photo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="tc-fb" style="display:none">${ini}</div>` : `<div class="tc-fb">${ini}</div>`}
                        <div style="flex:1;min-width:0">
                            <div class="tc-name">${esc(u.name || 'Unknown')}</div>
                            <div style="display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:wrap">
                                <span class="badge ${badgeClr(u.role)}">${esc(ROLE_LABELS[u.role] || u.role || '')}</span>
                                ${inTeam ? `<span class="badge bg-green" style="font-size:10px"><i class="ti ti-check" style="margin-right:3px;font-size:10px"></i>In Team</span>` : `<span class="badge bg-gray" style="font-size:10px">Not in Team</span>`}
                            </div>
                        </div>
                    </div>
                    ${u.email ? `<div style="font-size:12px;color:var(--text3);margin-bottom:9px">${esc(u.email)}</div>` : ''}
                    ${admin ? `<div class="tc-acts">
                        ${inTeam ? `<button class="btn btn-ghost btn-sm" style="flex:1;justify-content:center;color:#4ade80;border-color:rgba(34,197,94,0.3)" disabled><i class="ti ti-check"></i> In Team</button>`
                            : `<button class="btn btn-primary btn-sm" style="flex:1;justify-content:center" onclick="addEmployeeToTeamInline('${k}',this)"><i class="ti ti-user-plus"></i> Add to Team</button>`}
                        <button class="btn btn-ghost btn-sm btn-icon" onclick="openEmpModal('${k}')"><i class="ti ti-edit"></i></button>
                    </div>` : ''}
                </div>`;
            }).join('');
        }

        window.switchTeamTab = function (tab, btn) {
            window._activeTeamTab = tab;
            document.querySelectorAll('.team-tab').forEach(b => b.classList.remove('active')); btn.classList.add('active');
            const searchEl = document.getElementById('team-search'); if (searchEl) searchEl.value = '';
            const hint = document.getElementById('drag-hint-row'); if (hint) hint.style.display = tab === 'team' ? '' : 'none';
            filterTeamView('');
        };
        window.filterTeamView = function (query) {
            const q = query.toLowerCase().trim();
            const grid = document.getElementById('team-grid'); if (!grid) return;
            if (window._activeTeamTab === 'employees') {
                const empArr = window._empArr || [];
                const filtered = q ? empArr.filter(u => (u.name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q) || (ROLE_LABELS[u.role] || '').toLowerCase().includes(q)) : empArr;
                grid.innerHTML = renderEmployeeCards(filtered, window._teamArr || []);
            } else {
                const arr = window._teamArr || [];
                const filtered = q ? arr.filter(m => (m.name || '').toLowerCase().includes(q) || (m.position || m.role || '').toLowerCase().includes(q) || [...(m.expertise || []), ...(m.skills || [])].join(' ').toLowerCase().includes(q)) : arr;
                grid.innerHTML = renderTeamCards(filtered, arr);
                if (isAdmin()) makeDraggable(grid, '.tc[data-id]', saveTeamOrder);
            }
        };
        window.addEmployeeToTeamInline = async function (k, btn) {
            const u = getObj(k); if (!u) return;
            spinBtn(btn, 'Adding…');
            try {
                const result = await api('POST', '/team/from-user/' + encodeURIComponent(u._id));
                const member = result?.data;
                if (!member?._id) throw new Error('Team member was not returned by the server');
                const current = Array.isArray(window._teamArr) ? window._teamArr : [];
                window._teamArr = [...current.filter(m => m._id !== member._id), member];
                toast(result.alreadyExists ? `${u.name} is already in Team` : `${u.name} added to Team!`);
                filterTeamView(document.getElementById('team-search')?.value || '');
            } catch (e) { toast(e.message, 'err'); restoreBtn(btn); }
        };
        window.toggleWebVisibility = async function (id, currentlyVisible) {
            try { await api('PUT', '/team/' + id, { showOnWebsite: !currentlyVisible }); toast(currentlyVisible ? 'Hidden from website' : 'Now visible', 'info'); PAGES.team(); } catch (e) { toast(e.message, 'err'); }
        };
        window.openTeamModal = function (k) {
            const m = k ? getObj(k) : null;
            const photo = m?.image?.url || m?.avatar || m?.avatarImg || '';
            const skills = Array.isArray(m?.expertise) ? m.expertise.join(', ') : Array.isArray(m?.skills) ? m.skills.join(', ') : '';
            const isVisible = m ? m.showOnWebsite !== false : true;
            openModal(m ? 'Edit Member' : 'Add Member', `
                <div class="frow"><div class="field"><label>Full Name *</label><input id="tm-name" value="${esc(m?.name || '')}"></div><div class="field"><label>Position</label><input id="tm-pos" value="${esc(m?.position || '')}" placeholder="Lead Developer"></div></div>
                <div class="field"><label>Bio</label><textarea id="tm-bio">${esc(m?.bio || '')}</textarea></div>
                <div class="frow"><div class="field"><label>Email</label><input id="tm-email" value="${esc(m?.email || '')}"></div><div class="field"><label>Phone</label><input id="tm-phone" value="${esc(m?.phone || '')}"></div></div>
                <div class="field"><label>Profile Photo</label>${imgField('tm-photo', 'tm-photop', true, photo)}</div>
                <div class="frow"><div class="field"><label>Instagram</label><input id="tm-ig" value="${esc(m?.social?.instagram || m?.instagram || '')}"></div><div class="field"><label>LinkedIn</label><input id="tm-li" value="${esc(m?.social?.linkedin || m?.linkedin || '')}"></div></div>
                <div class="field"><label>Skills <span style="font-size:10px;color:var(--text3)">(comma separated)</span></label><input id="tm-skills" value="${esc(skills)}" placeholder="React, Node.js, Figma"></div>
                <label class="check-row"><input type="checkbox" id="tm-visible" ${isVisible ? 'checked' : ''}><div><span>Show on Website</span><small>Visible on the public team page</small></div></label>
                <div class="mft"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="tm-btn" onclick="saveMember('${esc(m?._id || '')}')"><i class="ti ti-device-floppy"></i> Save</button></div>`, true);
        };
        window.saveMember = async function (id) {
            const skillsRaw = document.getElementById('tm-skills').value.split(',').map(s => s.trim()).filter(Boolean);
            const photoUrl = document.getElementById('tm-photo').value.trim();
            const body = { name: document.getElementById('tm-name').value.trim(), position: document.getElementById('tm-pos').value.trim() || 'Team Member', bio: document.getElementById('tm-bio').value.trim(), email: document.getElementById('tm-email').value.trim(), phone: document.getElementById('tm-phone').value.trim(), expertise: skillsRaw, skills: skillsRaw, showOnWebsite: document.getElementById('tm-visible').checked, social: { instagram: document.getElementById('tm-ig').value.trim(), linkedin: document.getElementById('tm-li').value.trim() } };
            if (photoUrl) { body.image = { url: photoUrl }; body.avatar = photoUrl; }
            if (!body.name) return toast('Name required', 'err');
            const btn = document.getElementById('tm-btn'); spinBtn(btn, 'Saving…');
            try { if (id) await api('PUT', '/team/' + id, body); else await api('POST', '/team', body); toast('Saved'); closeModal(); PAGES.team(); } catch (e) { toast(e.message, 'err'); }
            restoreBtn(btn);
        };
        window.delMember = async function (id) {
            if (!confirm('Remove?')) return;
            try { await api('DELETE', '/team/' + id); toast('Removed'); PAGES.team(); } catch (e) { toast(e.message, 'err'); }
        };
    </script>

    <script>
        PAGES.contacts = async () => {
            const pc = document.getElementById('content');
            try {
                const contacts = await apiGet('/contacts'); const arr = Array.isArray(contacts) ? contacts : [];
                const rows = arr.map(c => {
                    const k = storeObj(c);
                    return `<div class="list-row click" onclick="viewContact('${k}')">
                        <div class="row-av">${esc((c.name || '?')[0].toUpperCase())}</div>
                        <div class="row-info"><div class="row-title">${esc(c.name)}</div><div class="row-sub">${esc(c.email)} · ${fmt(c.createdAt)}</div></div>
                        <span class="badge ${c.status === 'resolved' ? 'bg-green' : c.status === 'inprogress' ? 'bg-blue' : 'bg-amber'}">${esc(c.status || 'new')}</span>
                    </div>`;
                }).join('');
                pc.innerHTML = `<div class="page"><div class="ph"><div><h2>Contacts</h2><p>Tap to view & reply</p></div></div>
                    <div class="list">${rows || '<div class="list-empty">No contacts yet.</div>'}</div></div>`;
            } catch (e) { pc.innerHTML = `<div class="list-empty">Error: ${esc(e.message)}</div>`; }
        };
        window.viewContact = function (k) {
            const c = getObj(k); if (!c) return;
            const ph = (c.phone || '').replace(/[^0-9]/g, '');
            const wa = `https://wa.me/${ph || ''}?text=${encodeURIComponent('Hi ' + c.name + ', regarding your inquiry about ' + (c.service || 'our services'))}`;
            openModal('Contact — ' + c.name, `
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><div class="row-av" style="width:48px;height:48px;font-size:16px">${esc((c.name || '?')[0].toUpperCase())}</div><div><div style="font-weight:600;font-size:16px">${esc(c.name)}</div><div style="font-size:13px;color:var(--text3)">${esc(c.email)}</div></div></div>
                <div style="background:var(--surface2);border-radius:10px;padding:13px;margin-bottom:11px"><div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Service</div><div>${esc(c.service || '—')}</div></div>
                <div style="background:var(--surface2);border-radius:10px;padding:13px;margin-bottom:14px"><div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Message</div><div style="font-size:13.5px;white-space:pre-wrap;line-height:1.6">${esc(c.message || '')}</div></div>
                <div class="field"><label>Status</label><select id="ct-status" onchange="updateCtStatus('${esc(c._id)}',this.value)">
                    <option value="new" ${c.status === 'new' || !c.status ? 'selected' : ''}>New</option>
                    <option value="inprogress" ${c.status === 'inprogress' ? 'selected' : ''}>In Progress</option>
                    <option value="resolved" ${c.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                </select></div>
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                    <a href="${wa}" target="_blank" class="btn btn-ghost btn-sm" style="color:#25D366;border-color:rgba(37,211,102,0.3)"><i class="ti ti-brand-whatsapp"></i> WhatsApp</a>
                    <a href="mailto:${esc(c.email)}?subject=Re: ${esc(c.service || 'Inquiry')}&body=Hi ${esc(c.name)}," class="btn btn-ghost btn-sm"><i class="ti ti-mail"></i> Email</a>
                </div>
                <div class="mft" style="margin-top:14px"><button class="btn btn-danger" onclick="delCtModal('${esc(c._id)}')"><i class="ti ti-trash"></i> Delete</button><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>`);
        };
        window.updateCtStatus = async function (id, status) {
            try { await api('PUT', '/contacts/' + id, { status }); toast('Status updated', 'info'); PAGES.contacts(); } catch (e) { toast(e.message, 'err'); }
        };
        window.delCtModal = async function (id) {
            if (!confirm('Delete?')) return;
            try { await api('DELETE', '/contacts/' + id); toast('Deleted'); closeModal(); PAGES.contacts(); } catch (e) { toast(e.message, 'err'); }
        };

        PAGES.approvals = async () => {
            const pc = document.getElementById('content');
            try {
                const items = await apiGet('/approvals'); const arr = Array.isArray(items) ? items : [];
                const cards = arr.map(a => `
                    <div class="card" style="margin-bottom:12px"><div class="card-bd">
                        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
                            <div style="flex:1"><div style="display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap"><span style="font-weight:600;font-size:14px">${esc(a.title || a.type || 'Approval Request')}</span><span class="badge ${a.status === 'approved' ? 'bg-green' : a.status === 'rejected' ? 'bg-red' : 'bg-amber'}">${esc(a.status || 'pending')}</span></div>
                            <p style="font-size:12.5px;color:var(--text3);margin:0 0 7px">${esc(a.description || a.details || '')}</p>
                            <span style="font-size:11px;color:var(--text3)">By ${esc(a.requester?.name || a.author || 'Unknown')} · ${fmt(a.createdAt)}</span></div>
                            ${a.status === 'pending' ? `<div style="display:flex;gap:7px;flex-shrink:0"><button class="btn btn-success btn-sm" onclick="doApproval('${esc(a._id)}','approved')"><i class="ti ti-check"></i></button><button class="btn btn-danger btn-sm" onclick="doApproval('${esc(a._id)}','rejected')"><i class="ti ti-x"></i></button></div>` : ''}
                        </div>
                    </div></div>`).join('');
                pc.innerHTML = `<div class="page"><div class="ph"><div><h2>Approvals</h2></div></div>${cards || '<div class="list-empty">No pending approvals ✓</div>'}</div>`;
            } catch (e) { pc.innerHTML = `<div class="list-empty">Error: ${esc(e.message)}</div>`; }
        };
        window.doApproval = async function (id, status) {
            try { await api('PUT', '/approvals/' + id, { status }); toast('Request ' + status); PAGES.approvals(); } catch (e) { toast(e.message, 'err'); }
        };

        PAGES.users = async () => {
            const pc = document.getElementById('content');
            if (!isAdmin()) { pc.innerHTML = '<div class="list-empty">Admin access only</div>'; return; }
            try {
                const raw = await apiGet('/users'); const arr = Array.isArray(raw) ? raw : (raw?.users || []);
                const rows = arr.map(u => {
                    const k = storeObj(u);
                    const avHtml = (u.avatarImg || u.avatar) ? `<img src="${esc(u.avatarImg || u.avatar)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.style.display='none'">` : esc((u.name || '?')[0].toUpperCase());
                    return `<div class="list-row">
                        <div class="row-av">${avHtml}</div>
                        <div class="row-info">
                            <div class="row-title">${esc(u.name)} <span class="badge ${badgeClr(u.role)}" style="margin-left:4px;font-size:10px">${esc(ROLE_LABELS[u.role] || u.role)}</span></div>
                            <div class="row-sub">${esc(u.email)}</div>
                        </div>
                        <div class="row-acts">
                            <button class="btn btn-ghost btn-sm btn-icon" title="Edit" onclick="openEmpModal('${k}')"><i class="ti ti-edit"></i></button>
                            <button class="btn btn-ghost btn-sm btn-icon" title="Access" onclick="openAccessModal('${k}')"><i class="ti ti-shield"></i></button>
                            <button class="btn btn-ghost btn-sm btn-icon" title="Password" onclick="openPassResetModal('${k}')"><i class="ti ti-lock"></i></button>
                            ${u.email !== ADMIN_EMAIL ? `<button class="btn btn-ghost btn-sm btn-icon" onclick="delUser('${esc(u._id)}')"><i class="ti ti-trash"></i></button>` : ''}
                        </div>
                    </div>`;
                }).join('');
                pc.innerHTML = `<div class="page">
                    <div class="ph"><div><h2>Employees & Roles</h2></div><button class="btn btn-primary" onclick="openEmpModal(null)"><i class="ti ti-user-plus"></i> Add</button></div>
                    <div class="list">${rows || '<div class="list-empty">No users found.</div>'}</div>
                </div>`;
            } catch (e) { pc.innerHTML = `<div class="list-empty">Error: ${esc(e.message)}</div>`; }
        };

        window.openEmpModal = async function (k) {
            let u = k ? getObj(k) : null;
            const isEdit = !!(u?._id);
            if (isEdit && u?._id) {
                try { const fresh = await apiGet('/users/' + u._id); if (fresh && (fresh._id || fresh.data?._id)) { u = fresh._id ? fresh : fresh.data; } } catch (e) { }
            }
            const kk = u ? storeObj(u) : null;
            openModal(isEdit ? 'Edit Employee' : 'Add Employee', `

    <script>
        window.saveEmployee = async function (id, kk) {
            const cachedUser = kk && kk !== 'null' ? getObj(kk) : null;
            const nameEl = document.getElementById('us-name');
            const emailEl = document.getElementById('us-email');
            const posEl = document.getElementById('us-pos');
            const passEl = document.getElementById('us-pass');
            const roleEl = document.getElementById('us-role');
            const addToTeamEl = document.getElementById('us-addteam');
            const name = nameEl ? nameEl.value.trim() : (cachedUser?.name || '');
            const email = (emailEl && !emailEl.disabled) ? emailEl.value.trim() : (cachedUser?.email || '');
            const pos = posEl ? posEl.value.trim() : '';
            const pass = passEl ? passEl.value : '';
            const role = (roleEl && !roleEl.disabled) ? roleEl.value : (cachedUser?.role || '');
            const addToTeam = addToTeamEl ? addToTeamEl.checked : false;
            if (id) {
                if (!email) return toast('Email missing — reload and try again', 'err');
                const btn = document.getElementById('us-btn'); spinBtn(btn, 'Saving…');
                try {
                    const username = deriveUsername(email, cachedUser?.username);
                    let saved = false; let lastErr = '';
                    for (const body of [{ name, email, username, role, position: pos }, { name, email, username, role }, { name, username, role }]) {
                        if (saved) break;
                        Object.keys(body).forEach(bk => { if (body[bk] === '') delete body[bk]; });
                        try { await api('PUT', '/users/' + id, body); saved = true; } catch (e) { lastErr = e.message; }
                    }
                    if (!saved) throw new Error('Update failed: ' + lastErr);
                    const synced = await syncTeamMember({ name, email, position: pos, role });
                    toast('Employee updated!' + (synced ? ' Team card updated.' : '')); closeModal(); PAGES.users();
                } catch (e) { toast(e.message, 'err'); }
                restoreBtn(document.getElementById('us-btn'));
            } else {
                if (!email) return toast('Email required', 'err');
                if (pass.length < 6) return toast('Password min 6 characters', 'err');
                const btn = document.getElementById('us-btn'); spinBtn(btn, 'Creating…');
                try {
                    const baseUsername = email.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
                    const username = (baseUsername.length >= 3 ? baseUsername : 'user') + Math.floor(Math.random() * 900 + 100);
                    await api('POST', '/auth/register', { name, email, username, password: pass, role, position: pos });
                    if (addToTeam) {
                        try { await api('POST', '/team', { name, position: pos || ROLE_LABELS[role] || role, email, expertise: [], skills: [], showOnWebsite: false, bio: '', social: {} }); toast('Employee created + added to Team (hidden)'); }
                        catch (te) { toast('Employee created. Team add failed — add manually.', 'info'); }
                    } else { toast('Employee created!'); }
                    closeModal(); PAGES.users();
                } catch (e) { toast(e.message, 'err'); }
                restoreBtn(document.getElementById('us-btn'));
            }
        };

        window.saveProfile = async function () {

            if (skillsList.length) { body.skills = skillsList; body.expertise = skillsList; }
            if (resumeUrl) body.resumeUrl = resumeUrl;
            const btn = document.getElementById('st-save-btn'); spinBtn(btn, 'Saving…');
            try {
                let saved = false;
                const username = deriveUsername(user?.email, user?.username);
                for (const fn of [
                    () => api('PUT', '/auth/profile', body),
                    () => api('PATCH', '/auth/me', body),
                    () => api('PUT', '/auth/update', body),
                    () => user?._id ? api('PUT', '/users/' + user._id, { ...body, email: user.email, username }) : Promise.reject(new Error('no id'))

            const np = document.getElementById('pr-new').value;

            try {
                let done = false;
                for (const fn of [
                    () => api('PUT', '/users/' + uid, { password: np }),
                    () => api('PATCH', '/users/' + uid, { password: np }),
                    () => api('PUT', '/auth/admin/reset-password', { userId: uid, newPassword: np }),

                        <div class="card" style="margin-bottom:14px"><div class="card-hd">Change Password</div><div class="card-bd">
                            <div class="field"><label>Current Password</label><div class="pw-wrap"><input id="sp-cur" type="password" placeholder="Current password" autocomplete="current-password"><button type="button" class="pw-eye" onclick="togglePw('sp-cur',this)" tabindex="-1"><i class="ti ti-eye"></i></button></div></div>
                            <div class="field"><label>New Password</label><div class="pw-wrap"><input id="sp-new" type="password" placeholder="Min 6 characters" autocomplete="new-password"><button type="button" class="pw-eye" onclick="togglePw('sp-new',this)" tabindex="-1"><i class="ti ti-eye"></i></button></div></div>
                            <div class="field"><label>Confirm Password</label><div class="pw-wrap"><input id="sp-conf" type="password" placeholder="Repeat new password" autocomplete="new-password"><button type="button" class="pw-eye" onclick="togglePw('sp-conf',this)" tabindex="-1"><i class="ti ti-eye"></i></button></div></div>
                            <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap"><button class="btn btn-primary" id="sp-btn" onclick="savePassword()"><i class="ti ti-lock"></i> Update</button><button class="btn btn-ghost btn-sm" onclick="forgotModal()"><i class="ti ti-help"></i> Forgot</button></div>
                        </div></div>
                        ${isAdmin() ? `<div class="card"><div class="card-hd">Site URL</div><div class="card-bd"><div class="field"><label>Website URL</label><input id="site-url-inp" value="${esc(savedSite)}" inputmode="url"></div><button class="btn btn-primary" onclick="saveSiteUrl()"><i class="ti ti-device-floppy"></i> Save</button></div></div>` : ''}
                    </div>
                    <div class="card"><div class="card-hd">My Access</div><div class="card-bd">
                        ${p.map(x => `<div style="display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;text-transform:capitalize;color:var(--text)"><i class="ti ti-check" style="color:var(--green);font-size:15px"></i>${x}</div>`).join('')}
                        <button class="btn btn-danger btn-full" style="margin-top:18px" onclick="logout()"><i class="ti ti-logout"></i> Sign Out</button>
                    </div></div>
                </div>
            </div>`;
            // On mobile, make settings single column
            if (window.innerWidth <= 720) {
                const sg = document.getElementById('settings-grid');
                if (sg) sg.style.gridTemplateColumns = '1fr';
            }
            initSkillsTags('skills-tags-container', currentSkills);
            const avInp = document.getElementById('st-avatar');
            if (avInp) {
                avInp.addEventListener('input', () => {
                    const w = document.getElementById('prof-av-wrap');
                    if (w && avInp.value) { w.innerHTML = `<img src="${esc(avInp.value)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`; }
                    prevImg('st-avatar', 'st-av-prev', true);
                });
            }
        };

        window.forgotModal = function () {
            openModal('Forgot Password', `<div class="info-box">We'll send a reset email if your account exists.</div><div class="field"><label>Email</label><input id="fp-email" type="email" value="${esc(user?.email || '')}" inputmode="email"></div><div class="mft"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="fp-btn" onclick="doForgot()"><i class="ti ti-mail"></i> Send Email</button></div>`);
        };
        window.doForgot = async function () {
            const email = document.getElementById('fp-email').value.trim(); if (!email) return toast('Enter email', 'err');
            const btn = document.getElementById('fp-btn'); spinBtn(btn, 'Sending…');
            try { await api('POST', '/auth/forgot-password', { email }); toast('Reset email sent if account exists', 'info'); closeModal(); } catch (e) { toast(e.message || 'Reset not available', 'err'); }
            restoreBtn(btn);
        };
        window.saveSiteUrl = function () {
            const url = document.getElementById('site-url-inp')?.value?.trim(); if (!url) return toast('Enter URL', 'err');
            localStorage.setItem('ea_site_url', url); _sitUrl = url;
            const btn = document.getElementById('view-site-btn'); if (btn) btn.href = url; toast('Site URL saved!');
        };

        window.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('loader');
            setTimeout(() => loader.classList.add('ldr-drawing'), 100);
            setTimeout(() => loader.classList.add('ldr-filled'), 1700);
            setTimeout(() => loader.classList.add('ldr-revealed'), 2100);
            setTimeout(() => loader.classList.add('ldr-ready'), 2500);
            setTimeout(() => loader.classList.add('ldr-shining'), 3000);
            setTimeout(() => loader.classList.add('ldr-floating'), 3500);
            setTimeout(() => {
                loader.style.opacity = '0'; loader.style.pointerEvents = 'none';
                setTimeout(async () => {
                    loader.style.display = 'none';
                    try {
                        const stored = localStorage.getItem('ea_user'); const token = localStorage.getItem('ea_token');
                        if (stored && token) {
                            const cachedUser = JSON.parse(stored);
                            const freshUser = await apiGet('/auth/me');
                            user = { ...cachedUser, ...freshUser };
                            localStorage.setItem('ea_user', JSON.stringify(user));
                            initApp();
                        } else {
                            document.getElementById('login').style.display = 'flex';
                        }
                    } catch {
                        if (localStorage.getItem('ea_token')) expireSession();
                        else document.getElementById('login').style.display = 'flex';
                    }
                }, 800);
            }, 4200);
        });

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light');
            localStorage.setItem('ea_theme', isLight ? 'light' : 'dark');
            document.getElementById('theme-icon').className = isLight ? 'ti ti-moon' : 'ti ti-sun';
            document.getElementById('theme-btn').title = isLight ? 'Switch to dark' : 'Switch to light';
        }
        (function () { if (localStorage.getItem('ea_theme') === 'light') document.body.classList.add('light'); })();
    </script>
</body>

</html>
