<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Member | EL ATLAS Studio</title>
    <meta name="description" content="Meet our talented team member at EL ATLAS Studio — premium digital agency.">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box }

        :root {
            --bg-primary: #FFFFFF;
            --bg-secondary: #F8F8F8;
            --bg-tertiary: #F0F0F0;
            --text-primary: #0A0A0A;
            --text-secondary: #333333;
            --text-tertiary: #666666;
            --border-color: rgba(0,0,0,0.08);
            --border-red: rgba(232,25,44,0.15);
            --red: #E8192C;
            --red-dark: #B01020;
            --red-light: #FF3347;
            --red-glow: rgba(232,25,44,0.08);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.10);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.12)
        }

        [data-theme="dark"] {
            --bg-primary: #0A0A0A;
            --bg-secondary: #111111;
            --bg-tertiary: #1A1A1A;
            --text-primary: #FFFFFF;
            --text-secondary: #E0E0E0;
            --text-tertiary: #A0A0A0;
            --border-color: rgba(255,255,255,0.08);
            --border-red: rgba(232,25,44,0.25);
            --red-glow: rgba(232,25,44,0.12);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.5)
        }

        html { scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--red) transparent }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            cursor: none;
            transition: background 0.4s, color 0.4s;
            min-height: 100vh
        }

        /* ── CURSOR ─────────────────────────────────────────── */
        #cursor {
            position: fixed; width: 10px; height: 10px;
            background: var(--red); border-radius: 50%;
            pointer-events: none; z-index: 9999;
            transform: translate(-50%,-50%); transition: transform 0.08s
        }
        #cursor-ring {
            position: fixed; width: 34px; height: 34px;
            border: 1px solid var(--red); border-radius: 50%;
            pointer-events: none; z-index: 9998;
            transform: translate(-50%,-50%);
            transition: width 0.3s, height 0.3s; opacity: 0.55
        }
        #scroll-progress {
            position: fixed; top: 0; left: 0; height: 2px;
            background: linear-gradient(90deg, var(--red), #FF6B6B);
            z-index: 10000; width: 0%
        }

        /* ── NAV ────────────────────────────────────────────── */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            padding: 16px 60px;
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-primary);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: all 0.4s
        }
        .nav-logo {
            display: flex; align-items: center; gap: 12px;
            text-decoration: none
        }
        .nav-logo img { width: 50px; height: 50px; object-fit: contain }
        .nav-logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 17px; font-weight: 900;
            letter-spacing: -0.5px; color: var(--text-primary);
            text-transform: uppercase
        }
        .nav-logo-text span { color: var(--red) }
        .colom { display: flex; justify-content: center; flex-direction: column }
        .colom .spn { font-family: 'Playfair Display', serif; color: var(--red) }
        .nav-right { display: flex; align-items: center; gap: 14px }
        .nav-theme-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s
        }
        .nav-theme-btn:hover { border-color: var(--red) }
        .nav-theme-btn svg {
            width: 16px; height: 16px;
            stroke: var(--red); fill: none;
            stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round
        }
        .back-nav-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 9px 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 11px; font-weight: 600;
            letter-spacing: 1.2px; text-transform: uppercase;
            cursor: pointer; border-radius: 4px;
            text-decoration: none;
            transition: all 0.3s
        }
        .back-nav-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round }
        .back-nav-btn:hover {
            background: var(--red); border-color: var(--red); color: #fff;
            transform: translateX(-3px)
        }

        /* ── PAGE WRAPPER ────────────────────────────────────── */
        .page-wrap {
            padding-top: 80px;
            min-height: 100vh
        }

        /* ── HERO SECTION ────────────────────────────────────── */
        .member-hero {
            position: relative;
            padding: 60px 60px 0;
            overflow: hidden
        }
        .member-hero-bg {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse 60% 50% at 80% 50%, var(--red-glow), transparent);
            pointer-events: none
        }
        .member-hero-inner {
            position: relative; z-index: 1;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 60px; align-items: start;
            max-width: 1200px; margin: 0 auto
        }

        /* ── IMAGE COLUMN ─────────────────────────────────────── */
        .member-image-col { position: sticky; top: 100px }
        .member-photo-wrap {
            position: relative;
            width: 100%; aspect-ratio: 3/4;
            border-radius: 20px; overflow: hidden;
            background: var(--bg-tertiary);
            box-shadow: var(--shadow-lg)
        }
        .member-photo-wrap img {
            width: 100%; height: 100%;
            object-fit: cover; object-position: top center;
            display: block;
            transition: transform 0.6s cubic-bezier(0.16,1,0.3,1)
        }
        .member-photo-wrap:hover img { transform: scale(1.04) }
        .member-photo-fallback {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 72px; font-weight: 900;
            color: var(--red); background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary))
        }
        .member-photo-badge {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            background: rgba(10,10,10,0.85); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 16px 20px;
            display: flex; align-items: center; justify-content: space-between
        }
        .mpb-role {
            font-family: 'Poppins', sans-serif;
            font-size: 10px; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            color: var(--red); margin-bottom: 4px
        }
        .mpb-name {
            font-family: 'Playfair Display', serif;
            font-size: 18px; font-weight: 900; color: #fff;
            line-height: 1.2
        }
        .mpb-available {
            display: flex; align-items: center; gap: 6px;
            font-size: 10px; font-weight: 600;
            letter-spacing: 0.5px; color: #22c55e;
            font-family: 'Poppins', sans-serif
        }
        .mpb-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #22c55e;
            animation: pulse-dot 2s ease-in-out infinite
        }
        @keyframes pulse-dot {
            0%,100% { opacity: 1; transform: scale(1) }
            50% { opacity: 0.6; transform: scale(0.85) }
        }

        /* ── INFO COLUMN ──────────────────────────────────────── */
        .member-info-col { padding: 8px 0 80px }

        .breadcrumb {
            display: flex; align-items: center; gap: 10px;
            font-size: 12px; color: var(--text-tertiary);
            margin-bottom: 28px;
            font-family: 'Poppins', sans-serif;
            animation: fadeInDown 0.5s ease-out
        }
        .breadcrumb a {
            color: var(--red); text-decoration: none;
            transition: color 0.3s
        }
        .breadcrumb a:hover { text-decoration: underline }
        .breadcrumb svg { width: 12px; height: 12px; stroke: var(--text-tertiary); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round }

        .member-label {
            font-family: 'Poppins', sans-serif;
            font-size: 10px; font-weight: 700;
            letter-spacing: 3px; text-transform: uppercase;
            color: var(--red); margin-bottom: 14px;
            animation: fadeInUp 0.5s ease-out
        }
        .member-name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(36px, 5vw, 60px);
            font-weight: 900; line-height: 1.05;
            letter-spacing: -1.5px;
            color: var(--text-primary);
            margin-bottom: 12px;
            animation: fadeInUp 0.5s 0.05s ease-out both
        }
        .member-position {
            font-family: 'Poppins', sans-serif;
            font-size: 15px; font-weight: 500;
            color: var(--text-tertiary);
            margin-bottom: 32px;
            animation: fadeInUp 0.5s 0.1s ease-out both
        }

        .divider-line {
            width: 50px; height: 2px;
            background: var(--red);
            margin-bottom: 32px;
            animation: expandLine 0.6s 0.2s ease-out both
        }
        @keyframes expandLine { from { width: 0 } to { width: 50px } }

        .member-bio {
            font-size: 16px; line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 44px;
            max-width: 640px;
            animation: fadeInUp 0.5s 0.15s ease-out both
        }

        /* ── SECTIONS ─────────────────────────────────────────── */
        .info-section {
            margin-bottom: 44px;
            animation: fadeInUp 0.5s 0.2s ease-out both
        }
        .info-section-label {
            font-family: 'Poppins', sans-serif;
            font-size: 10px; font-weight: 700;
            letter-spacing: 2.5px; text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: 16px;
            display: flex; align-items: center; gap: 12px
        }
        .info-section-label::after {
            content: ''; flex: 1; height: 1px;
            background: var(--border-color)
        }

        /* Skills */
        .skills-wrap {
            display: flex; flex-wrap: wrap; gap: 10px
        }
        .skill-tag {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 7px 16px;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-size: 12px; font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.3s
        }
        .skill-tag:hover {
            border-color: var(--red);
            color: var(--red);
            background: var(--red-glow)
        }

        /* Experience */
        .exp-list { display: flex; flex-direction: column; gap: 16px }
        .exp-item {
            display: grid; grid-template-columns: 4px 1fr;
            gap: 0 20px; align-items: start;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color)
        }
        .exp-item:last-child { border-bottom: none }
        .exp-bar {
            width: 4px; height: 100%;
            background: var(--red); border-radius: 2px;
            min-height: 16px
        }
        .exp-body {}
        .exp-title {
            font-family: 'Poppins', sans-serif;
            font-size: 14px; font-weight: 700;
            color: var(--text-primary); margin-bottom: 3px
        }
        .exp-org {
            font-size: 13px; color: var(--red);
            font-weight: 500; margin-bottom: 3px
        }
        .exp-period {
            font-size: 11px; color: var(--text-tertiary);
            font-family: 'Poppins', sans-serif; letter-spacing: 0.3px
        }
        .exp-desc { font-size: 13px; color: var(--text-tertiary); margin-top: 6px; line-height: 1.6 }

        /* Socials */
        .socials-wrap { display: flex; gap: 12px; flex-wrap: wrap }
        .social-link {
            display: flex; align-items: center; gap: 9px;
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-size: 12px; font-weight: 600;
            letter-spacing: 0.3px;
            transition: all 0.3s
        }
        .social-link svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round }
        .social-link:hover { background: var(--red); border-color: var(--red); color: #fff; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(232,25,44,0.25) }

        /* Contact card */
        .contact-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px; padding: 28px 32px;
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 20px; margin-bottom: 44px;
            animation: fadeInUp 0.5s 0.25s ease-out both
        }
        .cc-item { display: flex; gap: 14px; align-items: center }
        .cc-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: var(--red-glow); border: 1px solid var(--border-red);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0
        }
        .cc-icon svg { width: 16px; height: 16px; stroke: var(--red); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round }
        .cc-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 3px; font-family: 'Poppins', sans-serif }
        .cc-value { font-size: 13px; font-weight: 600; color: var(--text-primary) }

        /* ── BACK BUTTON ──────────────────────────────────────── */
        .back-btn {
            display: inline-flex; align-items: center; gap: 10px;
            background: var(--red); color: #fff;
            padding: 14px 30px;
            border: none; border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 12px; font-weight: 700;
            letter-spacing: 1.5px; text-transform: uppercase;
            cursor: pointer; text-decoration: none;
            transition: all 0.3s;
            animation: fadeInUp 0.5s 0.3s ease-out both
        }
        .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
        .back-btn:hover { background: var(--red-dark); transform: translateX(-4px); box-shadow: 0 8px 24px rgba(232,25,44,0.3) }

        /* ── CTA STRIP ────────────────────────────────────────── */
        .cta-strip {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 60px;
            text-align: center;
            margin-top: 0
        }
        .cta-strip-inner { max-width: 600px; margin: 0 auto }
        .cta-strip h3 {
            font-family: 'Playfair Display', serif;
            font-size: 28px; font-weight: 900;
            margin-bottom: 12px
        }
        .cta-strip p { font-size: 15px; color: var(--text-tertiary); margin-bottom: 28px; line-height: 1.6 }
        .cta-btn {
            display: inline-flex; align-items: center; gap: 10px;
            background: var(--red); color: #fff;
            padding: 14px 32px; border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 12px; font-weight: 700;
            letter-spacing: 1.5px; text-transform: uppercase;
            text-decoration: none; transition: all 0.3s
        }
        .cta-btn:hover { background: var(--red-dark); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,25,44,0.3) }

        /* ── FOOTER ───────────────────────────────────────────── */
        footer {
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
            padding: 24px 60px;
            display: flex; align-items: center; justify-content: space-between;
            font-size: 12px; color: var(--text-tertiary)
        }
        footer a { color: var(--red); text-decoration: none }

        /* ── LOADING / ERROR ──────────────────────────────────── */
        .loading-state {
            min-height: 60vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
            color: var(--text-tertiary)
        }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 2px solid var(--border-color);
            border-top-color: var(--red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite
        }
        @keyframes spin { to { transform: rotate(360deg) } }
        .loading-text { font-family: 'Poppins', sans-serif; font-size: 12px; letter-spacing: 1px }
        .error-wrap {
            min-height: 60vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
            text-align: center; padding: 40px
        }
        .error-wrap h2 { font-family: 'Playfair Display', serif; font-size: 36px; color: var(--text-primary) }
        .error-wrap p { color: var(--text-tertiary); max-width: 400px; line-height: 1.6 }

        /* ── ANIMATIONS ───────────────────────────────────────── */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: translateY(0) } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-12px) } to { opacity: 1; transform: translateY(0) } }
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

        /* ── RESPONSIVE ───────────────────────────────────────── */
        @media (max-width: 1024px) {
            .member-hero-inner { grid-template-columns: 300px 1fr; gap: 40px }
        }
        @media (max-width: 768px) {
            nav { padding: 14px 20px }
            .member-hero { padding: 30px 20px 0 }
            .member-hero-inner { grid-template-columns: 1fr; gap: 32px }
            .member-image-col { position: static; max-width: 280px }
            .member-photo-wrap { aspect-ratio: 1/1 }
            .contact-card { grid-template-columns: 1fr; padding: 20px }
            .cta-strip { padding: 40px 20px }
            footer { padding: 20px; flex-direction: column; gap: 12px; text-align: center }
            .back-nav-btn span { display: none }
        }
    </style>
</head>

<body>
    <div id="cursor"></div>
    <div id="cursor-ring"></div>
    <div id="scroll-progress"></div>

    <!-- NAV -->
    <nav>
        <a class="nav-logo" href="index.html">
            <img src="logo2.png" alt="EL ATLAS" onerror="this.style.display='none'">
            <div class="colom nav-logo-text">
                <span>EL <span class="spn">ATLAS</span></span>
                <span style="font-size:9px;letter-spacing:2.5px;font-family:'Poppins',sans-serif;font-weight:500;color:var(--text-tertiary)">STUDIO</span>
            </div>
        </a>
        <div class="nav-right">
            <button class="nav-theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">
                <svg viewBox="0 0 24 24" id="themeIcon"><circle cx="12" cy="12" r="5"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24"/></svg>
            </button>
            <a href="index.html#team" class="back-nav-btn">
                <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                <span>Back</span>
            </a>
        </div>
    </nav>

    <div class="page-wrap">
        <div id="main-content">
            <!-- Loading state -->
            <div class="loading-state" id="loading-state">
                <div class="loading-spinner"></div>
                <div class="loading-text">Loading profile...</div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        // ── THEME ───────────────────────────────────────────────────
        function toggleTheme() {
            const h = document.documentElement;
            const n = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            h.setAttribute('data-theme', n); localStorage.setItem('theme', n); updateThemeIcon(n);
        }
        function updateThemeIcon(t) {
            const i = document.getElementById('themeIcon');
            i.innerHTML = t === 'dark'
                ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
                : '<circle cx="12" cy="12" r="5"/><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24"/>';
        }
        const _st = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', _st); updateThemeIcon(_st);

        // ── SCROLL PROGRESS ─────────────────────────────────────────
        window.addEventListener('scroll', () => {
            const pct = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight) * 100;
            document.getElementById('scroll-progress').style.width = pct + '%';
        }, { passive: true });

        // ── CUSTOM CURSOR ────────────────────────────────────────────
        const _cur = document.getElementById('cursor'), _ring = document.getElementById('cursor-ring');
        let _cx = 0, _cy = 0, _rx = 0, _ry = 0;
        document.addEventListener('mousemove', e => { _cx = e.clientX; _cy = e.clientY; _cur.style.left = _cx + 'px'; _cur.style.top = _cy + 'px' });
        (function raf() { _rx += (_cx - _rx) * 0.12; _ry += (_cy - _ry) * 0.12; _ring.style.left = _rx + 'px'; _ring.style.top = _ry + 'px'; requestAnimationFrame(raf) })();
        function initCursor() {
            document.querySelectorAll('a, button, .skill-tag').forEach(el => {
                el.addEventListener('mouseenter', () => { _cur.style.transform = 'translate(-50%,-50%) scale(2.5)'; _ring.style.width = '52px'; _ring.style.height = '52px' });
                el.addEventListener('mouseleave', () => { _cur.style.transform = 'translate(-50%,-50%) scale(1)'; _ring.style.width = '34px'; _ring.style.height = '34px' });
            });
        }

        // ── HELPERS ──────────────────────────────────────────────────
        function ini(name) { return name ? name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2) : '??' }
        function dateStr(d) { return d ? new Date(d).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) : '' }

        // ── RENDER ───────────────────────────────────────────────────
        function renderMember(m) {
            const photoUrl = m.image && m.image.url ? m.image.url : (m.photo || m.avatar || '');
            document.title = `${m.name || 'Team Member'} | EL ATLAS Studio`;

            // Skills
            const skills = (m.expertise || []).map(s => `<span class="skill-tag">${typeof s === 'string' ? s : (s.title || s)}</span>`).join('');

            // Experience
            const expArr = Array.isArray(m.experience) ? m.experience : [];
            const expHtml = expArr.length ? `
                <div class="info-section">
                    <div class="info-section-label">Experience</div>
                    <div class="exp-list">
                        ${expArr.map(e => `
                            <div class="exp-item">
                                <div class="exp-bar"></div>
                                <div class="exp-body">
                                    <div class="exp-title">${e.title || e.role || 'Position'}</div>
                                    <div class="exp-org">${e.company || e.organization || 'Company'}</div>
                                    <div class="exp-period">${e.period || e.duration || e.years || ''}</div>
                                    ${e.description ? `<div class="exp-desc">${e.description}</div>` : ''}
                                </div>
                            </div>`).join('')}
                    </div>
                </div>` : '';

            // Socials
            const soc = m.social || {};
            const socLinks = [
                soc.linkedin && `<a href="${soc.linkedin}" target="_blank" class="social-link"><svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>LinkedIn</a>`,
                soc.instagram && `<a href="${soc.instagram}" target="_blank" class="social-link"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>Instagram</a>`,
                soc.github && `<a href="${soc.github}" target="_blank" class="social-link"><svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>GitHub</a>`,
                soc.twitter && `<a href="${soc.twitter}" target="_blank" class="social-link"><svg viewBox="0 0 24 24"><path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2s9 5 20 5"/></svg>Twitter</a>`,
                soc.email && `<a href="mailto:${soc.email}" class="social-link"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6L12 13 2 6"/></svg>Email</a>`,
                soc.website && `<a href="${soc.website}" target="_blank" class="social-link"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>Website</a>`
            ].filter(Boolean).join('');

            const html = `
                <section class="member-hero">
                    <div class="member-hero-bg"></div>
                    <div class="member-hero-inner">
                        <!-- IMAGE -->
                        <div class="member-image-col">
                            <div class="member-photo-wrap">
                                ${photoUrl
                                    ? `<img src="${photoUrl}" alt="${m.name || ''}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">`
                                    : ''
                                }
                                <div class="member-photo-fallback" style="${photoUrl ? 'display:none' : ''}">${ini(m.name)}</div>
                            </div>
                            <div class="member-photo-badge">
                                <div>
                                    <div class="mpb-role">${m.position || m.role || 'Team Member'}</div>
                                    <div class="mpb-name">${m.name || 'Unknown'}</div>
                                </div>
                                <div class="mpb-available">
                                    <div class="mpb-dot"></div>
                                    Available
                                </div>
                            </div>
                        </div>
                        <!-- INFO -->
                        <div class="member-info-col">
                            <div class="breadcrumb">
                                <a href="index.html">Home</a>
                                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                                <a href="index.html#team">Team</a>
                                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                                <span>${m.name || 'Member'}</span>
                            </div>

                            <div class="member-label">Team Member</div>
                            <h1 class="member-name">${m.name || 'Team Member'}</h1>
                            <div class="member-position">${m.position || m.role || 'Digital Professional'}</div>
                            <div class="divider-line"></div>
                            <p class="member-bio">${m.bio || m.description || m.about || 'A talented member of the EL ATLAS Studio team, passionate about delivering exceptional digital experiences and pushing the boundaries of creative excellence.'}</p>

                            ${skills ? `
                            <div class="info-section">
                                <div class="info-section-label">Skills & Expertise</div>
                                <div class="skills-wrap">${skills}</div>
                            </div>` : ''}

                            ${expHtml}

                            ${socLinks ? `
                            <div class="info-section">
                                <div class="info-section-label">Connect</div>
                                <div class="socials-wrap">${socLinks}</div>
                            </div>` : ''}

                            <a href="index.html#team" class="back-btn">
                                <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                                Back to Team
                            </a>
                        </div>
                    </div>
                </section>

                <div class="cta-strip">
                    <div class="cta-strip-inner">
                        <h3>Work With Our Team</h3>
                        <p>Ready to bring your vision to life? Connect with us and let's create something extraordinary together.</p>
                        <a href="index.html#contact" class="cta-btn">Start a Project →</a>
                    </div>
                </div>

                <footer>
                    <span>&copy; ${new Date().getFullYear()} <strong>EL ATLAS Studio</strong>. All rights reserved.</span>
                    <a href="index.html">← Back to Home</a>
                </footer>
            `;

            document.getElementById('main-content').innerHTML = html;
            initCursor();
        }

        function showError(msg) {
            document.getElementById('main-content').innerHTML = `
                <div class="error-wrap">
                    <h2>Not Found</h2>
                    <p>${msg}</p>
                    <a href="index.html#team" class="back-btn" style="margin-top:8px">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                        Back to Team
                    </a>
                </div>
                <footer>
                    <span>&copy; ${new Date().getFullYear()} <strong>EL ATLAS Studio</strong>. All rights reserved.</span>
                    <a href="index.html">← Back to Home</a>
                </footer>
            `;
        }

        // ── LOAD ────────────────────────────────────────────────────
        async function init() {
            const slug = dataManager.getQueryParam('id');
            if (!slug) { showError('No team member specified.'); return; }

            // Try sessionStorage first (fast, no network)
            let member = dataManager.getTeamMember(slug);
            if (member) { renderMember(member); return; }

            // Fallback: fetch from API
            member = await dataManager.fetchTeamAndFind(slug);
            if (member) { renderMember(member); }
            else { showError('This team member could not be found. They may have been removed or the URL is incorrect.'); }
        }

        init();
    </script>
</body>
</html>
